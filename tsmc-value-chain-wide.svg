  .a{stroke:#888780;stroke-width:1.5;fill:none;marker-end:url(#at1)}
  .l{stroke:#888780;stroke-width:1.5;fill:none}
  @media (prefers-color-scheme: dark){
    svg{background:#1a1915}
    .t,.lbl,.s{fill:#b4b2a9}
