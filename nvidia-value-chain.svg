<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
  </marker>
  <style>
    .title{font:700 36px Arial,sans-serif;fill:#0f172a}
    .sub{font:400 18px Arial,sans-serif;fill:#475569}
    .hdr{font:700 20px Arial,sans-serif;fill:#0f172a}
