<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
  </marker>
  <style>
    .t{font:700 14px Arial,sans-serif}
    .s{font:400 12px Arial,sans-serif}
    .bt{font:700 14px Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
    .bs{font:400 12px Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
    .lbl{font:400 12px Arial,sans-serif;dominant-baseline:central;fill:#334155}
    .up{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.5}
    .up-t{fill:#1e3a8a}
    .nv{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}
    .nv-t{fill:#0f172a}
    .dc{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5;stroke-dasharray:5 4}
    .dc-t{fill:#78350f}
    .ec{fill:#dcfce7;stroke:#4ade80;stroke-width:1.5}
    .ec-t{fill:#14532d}
    .id{fill:#ede9fe;stroke:#a78bfa;stroke-width:1.5}
    .id-t{fill:#4c1d95}
    .a{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    .l{stroke:#64748b;stroke-width:1.5;fill:none}
  </style>
</defs>

