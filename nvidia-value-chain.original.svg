<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
  </marker>
  <style>
    .title{font:700 36px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 18px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:#475569}
    .hdr{font:700 20px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:#0f172a}
    .txt{font:400 17px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:#1e293b}
    .small{font:400 14px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:#475569}
    .center{font:700 26px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:white}
    .center2{font:400 17px 'Malgun Gothic',AppleGothic,Arial,sans-serif;fill:white}
    .confirmed{fill:#f8fafc;stroke:#0f172a;stroke-width:2}
    .inferred{fill:#fff;stroke:#0f172a;stroke-width:2;stroke-dasharray:10 8}
    .economic{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:3 7}
    .nvidia{fill:#111827;stroke:#111827;stroke-width:2}
    .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1600" height="1050" fill="white"/>
<text x="70" y="70" class="title">NVIDIA AI 인프라 가치사슬과 고객 집중도</text>
