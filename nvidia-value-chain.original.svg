<!-- footer legend -->
<line x1="70" y1="915" x2="1535" y2="915" stroke="#cbd5e1" stroke-width="1"/>
<text x="70" y="950" class="hdr">범례</text>
<rect x="165" y="932" width="42" height="25" class="confirmed"/>
<text x="220" y="951" class="small">SEC / 공식 확인</text>
<rect x="425" y="932" width="42" height="25" class="inferred"/>
