<text x="1335" y="283" class="hdr">AI 모델 개발사</text>
<text x="1335" y="318" class="txt">OpenAI / Anthropic / xAI</text>

<rect x="1310" y="390" rx="14" ry="14" width="235" height="105" class="economic"/>
